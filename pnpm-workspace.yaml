# Solo estos paquetes pueden ejecutar scripts de instalación.
#
# Los tres traen binarios que se compilan o descargan en postinstall: sin
# esbuild y unrs-resolver no arrancan ni vitest ni el linter, y workerd es el
# runtime de Workers que usa `wrangler dev` para servir el sitio en local.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  workerd: true
